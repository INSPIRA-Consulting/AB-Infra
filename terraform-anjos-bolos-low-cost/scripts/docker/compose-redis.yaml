version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: anjos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-data:/data
    networks:
      - backend-net

volumes:
  redis-data:
    driver: local

networks:
  backend-net:
    driver: bridge
