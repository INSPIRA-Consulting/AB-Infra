services:
  web_server:
    # Usa a imagem oficial do NGINX
    image: nginx:latest
    container_name: frontend_nginx
    
    # Mapeia as portas: Porta_Externa:Porta_Interna
    ports:
      - "80:80"
    
    # Mapeia os volumes: Pasta_Local:Pasta_No_Container
    volumes:
      - /home/ubuntu/frontend:/usr/share/nginx/html
      - /home/ubuntu/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
    
    # Variáveis de ambiente
    environment:
      - IP_PORTA_API=${IP_PORTA_API:-10.25.0.68:8080}
    
    # Reinicia o contêiner automaticamente
    restart: unless-stopped